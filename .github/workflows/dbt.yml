name: dbt build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"   # every Monday: pull new IPCA months and rebuild
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          dbt deps --profiles-dir .

      - name: Ingest (ERP extract + BCB IPCA API)
        run: |
          python ingestion/generate_erp_data.py
          python ingestion/load_bcb_ipca.py

      - name: Source freshness
        run: dbt source freshness --profiles-dir .

      - name: dbt build (seeds, models, data tests, unit tests)
        run: dbt build --profiles-dir .

      - name: Generate docs
        run: |
          dbt docs generate --profiles-dir . --static
          mkdir -p site && cp target/static_index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy-docs:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
